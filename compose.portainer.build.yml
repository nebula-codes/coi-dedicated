# Native Linux server and browser manager, alpha.6.3. Choose the image explicitly.
# Preserve the existing data volume; no Steam profile or desktop is needed.
services:
  coi-server:
    image: "${COI_IMAGE:?Set COI_IMAGE to the reviewed native Linux image}"
    build:
      context: "${COI_BUILD_CONTEXT:?Set a reviewed source checkout or Git URL containing the native Linux Dockerfile}"
      dockerfile: Dockerfile
      args:
        SERVER_VERSION: "${COI_SERVER_VERSION:?Set the matching Linux package version}"
        SERVER_ARCHIVE_URL: "${COI_SERVER_ARCHIVE_URL:?Set the Linux server archive URL}"
        SERVER_ARCHIVE_SHA256: "${COI_SERVER_ARCHIVE_SHA256:?Set the archive SHA-256}"
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 300s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${COI_BIND_IP:-0.0.0.0}:${COI_GAME_PORT:-28551}:28551/tcp"
      - "${COI_MANAGER_BIND_IP:-0.0.0.0}:${COI_MANAGER_PORT:-28560}:28560/tcp"
    environment:
      # Reject an old auth-only deployment before it can load an island.
      # Remove COI_AUTH_ONLY from the stack environment during migration.
      COI_AUTH_ONLY: "${COI_AUTH_ONLY:-false}"
      COI_MANAGER_ENABLED: "true"
      COI_MANAGER_AUTOSTART: "${COI_MANAGER_AUTOSTART:-true}"
      COI_PUBLIC_GAME_PORT: "${COI_GAME_PORT:-28551}"
      COI_MANAGER_HOST: "${COI_MANAGER_HOST:-}"
      COI_MAP: "${COI_MAP:-New Haven}"
      COI_STARTING_FACTORY: "${COI_STARTING_FACTORY:-true}"
      COI_AUTOSAVE_SECONDS: "${COI_AUTOSAVE_SECONDS:-60}"
    volumes:
      - type: bind
        source: "${COI_GAME_DIR:?Set COI_GAME_DIR to the absolute game folder on the Linux Docker host}"
        target: /game
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: coi-data
        target: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 35s
      start_period: 5m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  coi-data:
    name: "${COI_DATA_VOLUME:-coi-dedicated-data}"
