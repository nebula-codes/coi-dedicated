name: Publish experimental native Linux container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Linux release version, without the v prefix
        required: true
        default: 0.1.0-alpha.6.3

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  publish:
    # Dispatch only after matching host lifecycle/replay tests pass locally.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/nebula-codes/coi-dedicated
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve the matching Linux release and archive checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$REQUESTED_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Invalid release version'; exit 1
          fi
          ARCHIVE="CoI-Dedicated-Server-$VERSION-linux-x64.zip"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          curl --fail --show-error --location --retry 3 "$RELEASE_URL/SHA256SUMS-linux.txt" -o checksums.txt
          SHA="$(awk -v file="$ARCHIVE" '{ sub(/\r$/, "", $0) } $2 == file {print $1}' checksums.txt)"
          if [[ ! "$SHA" =~ ^[a-fA-F0-9]{64}$ ]]; then echo 'Missing or ambiguous Linux archive checksum'; exit 1; fi
          printf 'VERSION=%s\nSERVER_ARCHIVE_SHA256=%s\nSERVER_ARCHIVE_URL=%s/%s\n' "$VERSION" "$SHA" "$RELEASE_URL" "$ARCHIVE" >> "$GITHUB_ENV"
      - name: Build from the checksum-pinned distributable
        run: |
          docker build --platform linux/amd64 \
            --build-arg "SERVER_VERSION=$VERSION" \
            --build-arg "SERVER_ARCHIVE_SHA256=$SERVER_ARCHIVE_SHA256" \
            --build-arg "SERVER_ARCHIVE_URL=$SERVER_ARCHIVE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:alpha" .
      - name: Verify application starts without bundled game files
        run: |
          docker run --rm --init --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint sh "$IMAGE:$VERSION" -euc '
            dotnet /app/server/CoiDedicated.dll --help
            dotnet /app/control/CoiDedicated.Control.dll --help
            test -f /app/manager/CoiDedicated.Manager.dll
            test -f /app/manager/wwwroot/index.html
            dotnet --list-runtimes | grep Microsoft.AspNetCore.App
            test -z "$(find /app -iname "Mafi*.dll" -o -iname "UnityEngine*.dll" -o -name "*.key" -o -name "*.save")"
            test ! -e /app/steam-ui.sh
          '
      - name: Verify entrypoint signals, exit status and migration guard
        run: |
          docker run --rm --init --network none --entrypoint sh \
            -e COI_SUPERVISOR_TEST=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/docker/test-supervisor.sh,dst=/tmp/test-supervisor.sh,readonly" \
            "$IMAGE:$VERSION" /tmp/test-supervisor.sh
      - name: Publish to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:alpha"
